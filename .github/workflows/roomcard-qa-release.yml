name: Room Card checks and patch release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript and regression tests
        run: |
          node --check frankys-stuff-room-card.js
          node --check tests/roomcard-auto-mode.test.js
          node tests/roomcard-auto-mode.test.js

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified v0.3.2 patch release (once)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.2 >/dev/null 2>&1; then
            echo "v0.3.2 already released."
          else
            gh release create v0.3.2 \
              --target "${{ github.sha }}" \
              --title "Frankys_Stuff Room Card v0.3.2" \
              --notes-file RELEASE_NOTES_v0.3.2.md \
              --latest
          fi
